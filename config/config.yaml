# TableWatch configuration. Every key is optional; defaults live in tablewatch/config.py.
# Override any value on the command line: python -m tablewatch run --set state.seat_confirm_s=5

site: main-dining-room         # name of this venue/camera; keeps analytics from different cameras apart
zones_path: config/zones.yaml

input:
  source: data/sample.mp4      # file path, rtsp://user:pass@camera/stream, or webcam index "0"
  target_fps: 10               # analyse at most 10 frames/s; plenty for table service
  loop: false
  realtime: false              # true = pace a file like a live camera (dashboard demos)
  reconnect_delay_s: 5

detection:
  model: yolo11n.pt            # yolo11s.pt / yolov8n.pt ... larger = more accurate, slower
  device: null                 # null = auto (CUDA/MPS if available), or "cpu", "cuda:0", "mps"
  confidence: 0.25
  iou: 0.5
  image_size: 640              # raise to 960/1280 for wide shots with small people

tracking:
  activation_threshold: 0.5
  high_confidence_threshold: 0.5
  lost_track_buffer_s: 3.0     # keep IDs through short occlusions
  min_iou: 0.1
  min_consecutive_frames: 2

roles:
  classifier: heuristic        # or "my_package.module:MyClassifier"
  min_zones_for_staff: 2       # lingered at 2+ different tables -> staff
  zone_min_dwell_s: 1.5
  standing_aspect_ratio: 2.0   # box height/width; tune per camera angle (null disables)
  standing_staff_s: 30         # standing this long in total -> staff (null disables)
  travel_staff_body_heights: 12  # walked this far in total -> staff (null disables)
  sticky_staff: true
  forget_after_s: 30
  uniform:
    enabled: false             # turn on if staff wear a distinctive colour
    hsv_ranges:                # OpenCV HSV: H 0-179, S 0-255, V 0-255
      - [[0, 0, 0], [179, 255, 60]]   # black / very dark clothing
    min_fraction: 0.45
    min_observations: 5
    smoothing: 0.2

state:
  seat_confirm_s: 10           # guests present 10 s -> SEATED
  empty_confirm_s: 45          # guests gone 45 s -> EMPTY
  guest_gap_tolerance_s: 3
  visit_min_s: 2               # staff at table 2 s -> counts as a visit
  visit_end_grace_s: 4

served:                        # when drinks and food reach each table (estimated from detections)
  enabled: true
  drink_classes: [cup, wine glass, bottle]
  food_classes: [bowl, sandwich, pizza, cake, donut, hot dog, broccoli, carrot, apple, orange, banana]
  window_s: 6
  min_increase: 1
  visit_window_s: 90           # items must appear within 90 s of a staff visit

alerts:
  no_first_visit_s: 300        # seated 5 min without a staff visit
  visit_gap_s: 600             # 10 min since the last visit ended
  long_sitting_s: null         # e.g. 5400 to flag 90-minute sittings
  repeat_every_s: null         # e.g. 300 to re-notify every 5 min while active
  notifiers:
    - type: console
    - type: slack
      enabled: false
      url: https://hooks.slack.com/services/XXX/YYY/ZZZ
    - type: webhook
      enabled: false
      url: https://example.com/tablewatch-hook
    - type: whatsapp           # stub: logs only until wired up (see alerts/notifiers.py)
      enabled: false
      to: "+440000000000"

storage:
  db_path: data/tablewatch.db
  snapshot_interval_s: 1.0

output:
  video_path: null             # set (or pass --output) to save an annotated video
  show_window: false
  blur_heads: true             # privacy: blur heads in the annotated video
